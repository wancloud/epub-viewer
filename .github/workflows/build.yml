name: Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Flutter rewrite: one codebase builds both a small Android APK and a native Windows
# desktop app. Replaces the old PySide6/buildozer pipeline (which produced a ~674MB APK
# and needed the NDK/SDK-license/JAXB/sdkmanager workarounds now gone from this file).

env:
  FLUTTER_VERSION: "3.44.4"

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release

      - name: Report APK size
        run: ls -lh build/app/outputs/flutter-apk/*.apk

      - uses: actions/upload-artifact@v7
        with:
          name: EpubViewer-android
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build windows --release

      - name: Zip Windows build
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath EpubViewer-windows.zip
        shell: pwsh

      - uses: actions/upload-artifact@v7
        with:
          name: EpubViewer-windows
          path: EpubViewer-windows.zip
