name: Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows executable
        run: >
          pyinstaller --noconfirm --windowed --name EpubViewer
          --add-data "epubviewer/resources;epubviewer/resources" main.py

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v7
        with:
          name: EpubViewer-windows
          path: dist/EpubViewer/

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Create virtual environment
        run: |
          python -m venv .venv-android
          # `source activate` normally does two things: prepend the venv's bin dir to
          # PATH, and export VIRTUAL_ENV. Adding just the bin dir to GITHUB_PATH (as
          # below) makes python/pip resolve into the venv, but pyside6-android-deploy's
          # own venv check reads the VIRTUAL_ENV env var specifically -- without also
          # exporting that via GITHUB_ENV, it still thinks it isn't in a venv and tries
          # to prompt for confirmation, which crashes in CI (no stdin to answer it).
          echo "$(pwd)/.venv-android/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$(pwd)/.venv-android" >> "$GITHUB_ENV"

      - name: Install PySide6 deploy tooling
        run: |
          python -m pip install --upgrade pip
          # Pinned to match the Android wheel version downloaded below -- if you bump
          # this, bump the wheel filenames/URLs in the next step (and in
          # pysidedeploy-android.spec's [android] section) to the same version.
          pip install pyside6==6.11.1 buildozer cython
          # pyside6-android-deploy needs these but doesn't install them itself; the
          # exact list ships with PySide6 (PySide6/scripts/requirements-android.txt),
          # so install from that file rather than hardcoding package names here.
          pip install -r "$(python -c 'import PySide6, os; print(os.path.join(os.path.dirname(PySide6.__file__), "scripts", "requirements-android.txt"))')"

      # Verified: there is no auto-download for these (confirmed by reading PySide6's
      # own deploy_lib/android/android_config.py source) -- they must be fetched
      # manually. Qt publishes them at download.qt.io rather than PyPI (PyPI only has
      # desktop wheels), under the plain (non "-src") entries of the pyside6/shiboken6
      # release trees. Verified these exact URLs 200 OK before wiring them in here.
      - name: Download Android PySide6/Shiboken wheels
        run: |
          mkdir -p android-wheels
          curl -fL -o android-wheels/pyside6-android_aarch64.whl \
            https://download.qt.io/official_releases/QtForPython/pyside6/pyside6-6.11.1-6.11.1-cp311-cp311-android_aarch64.whl
          curl -fL -o android-wheels/shiboken6-android_aarch64.whl \
            https://download.qt.io/official_releases/QtForPython/shiboken6/shiboken6-6.11.1-6.11.1-cp311-cp311-android_aarch64.whl
          ls -la android-wheels/

      - name: Build Android APK
        run: pyside6-android-deploy -c pysidedeploy-android.spec

      - name: Upload Android build artifact
        uses: actions/upload-artifact@v7
        with:
          name: EpubViewer-android
          path: dist-android/**/*.apk
